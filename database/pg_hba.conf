# pg_hba.conf untuk PostgreSQL Primary (streaming replication)
# Dipasang melalui hba_file agar replikasi antar-container/antar-pod
# tidak bergantung pada pg_hba.conf bawaan image.

# Koneksi lokal di dalam container
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# Koneksi aplikasi (backend) dari jaringan internal Docker / Kubernetes
host    all             all             all                     scram-sha-256

# Koneksi replikasi (pg_basebackup & walreceiver)
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    replication     all             all                     scram-sha-256
