apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: ml-inference
  labels:
    app.kubernetes.io/part-of: distributed-ml-inference
data:
  realm-ml-inference.json: |
    {
      "realm": "ml-inference",
      "displayName": "Distributed ML Inference SSO",
      "enabled": true,
      "sslRequired": "none",
      "registrationAllowed": false,
      "accessTokenLifespan": 300,
      "roles": {
        "realm": [
          { "name": "user", "description": "Pengguna yang boleh mengakses endpoint API" },
          { "name": "admin", "description": "Administrator sistem" }
        ]
      },
      "users": [
        {
          "username": "demo",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Demo",
          "lastName": "User",
          "email": "demo@example.com",
          "credentials": [
            { "type": "password", "value": "demo123", "temporary": false }
          ],
          "realmRoles": [ "user" ],
          "requiredActions": []
        },
        {
          "username": "adminuser",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Admin",
          "lastName": "User",
          "email": "admin@example.com",
          "credentials": [
            { "type": "password", "value": "admin123", "temporary": false }
          ],
          "realmRoles": [ "user", "admin" ],
          "requiredActions": []
        }
      ],
      "clients": [
        {
          "clientId": "ml-backend",
          "name": "Distributed ML Inference Backend",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "ml-backend-secret",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "redirectUris": [ "http://localhost:8000/*" ],
          "webOrigins": [ "*" ],
          "protocolMappers": [
            {
              "name": "ml-backend-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.custom.audience": "ml-backend",
                "access.token.claim": "true",
                "id.token.claim": "false",
                "introspection.token.claim": "true"
              }
            }
          ]
        }
      ]
    }
