# CATATAN KEAMANAN:
# Nilai di bawah adalah kredensial demo untuk lingkungan tugas/lokal.
# Untuk produksi gunakan Secret yang dibuat dari vault/CI (mis. kubectl create secret
# generic ...), jangan commit kredensial asli ke Git.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: ml-inference
  labels:
    app.kubernetes.io/part-of: distributed-ml-inference
type: Opaque
stringData:
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: admin123
  POSTGRES_DB: ml_database
  REPLICATION_USER: replicator
  REPLICATION_PASSWORD: repl123
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-credentials
  namespace: ml-inference
  labels:
    app.kubernetes.io/part-of: distributed-ml-inference
type: Opaque
stringData:
  POSTGRES_DB: keycloak
  POSTGRES_USER: keycloak
  POSTGRES_PASSWORD: keycloak123
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: ml-inference
  labels:
    app.kubernetes.io/part-of: distributed-ml-inference
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_BOOTSTRAP_ADMIN_PASSWORD: admin
